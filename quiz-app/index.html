<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Quiz App</title>
</head>

<body>

<div class="btn_start">
    <button class="btn btn-warning btn-lg">Start Quiz</button>
</div>

<div class="card quiz_box">
    <header class="card-header">
        <div class="title">Quiz App</div>
        <div class="timer">
            <div class="time_text">Remaining Time</div>
            <div class="time_second">10</div>
        </div>
        <div class="time_line"></div>
    </header>
    <section class="card-body">
        <div class="question_text">
            <!-- <span>Which of the following is a JS package manager?</span> -->
        </div>
        <div class="option_list">
            <!-- Example Options:
            <div class="option">
                <span>a: Node.js</span>
                <div class="icon"><i class="fas fa-check"></i></div>
            </div>
            <div class="option">
                <span>b: TypeScript</span>
                <div class="icon"><i class="fas fa-times"></i></div>
            </div>
            <div class="option correct">
                <span>c: NPM</span>
                <div class="icon"><i class="fas fa-check"></i></div>
            </div>
            <div class="option incorrect">
                <span>d: NuGet</span>
                <div class="icon"><i class="fas fa-times"></i></div>
            </div> -->
        </div>
    </section>
    <footer class="card-footer">
        <div class="question_index">
            <!-- Current Question Index -->
        </div>
        <button class="next_btn btn btn-primary btn-sm">Next Question</button>
    </footer>
</div>

<div class="card score_box">
    <div class="icon">
        <i class="fas fa-crown"></i>
    </div>
    <div class="score_text"></div>
    <div class="buttons">
        <button class="btn btn-primary btn_replay">Restart</button>
        <button class="btn btn-primary btn_quit">Finish Quiz</button>
    </div>
</div>

<script src="soru.js"></script>
<script src="quiz.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>
</body>

</html>
